name: ${COMPOSE_PROJECT_NAME:-kazhal-production}

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 8000
  CORS_ORIGINS: ${WEB_ORIGIN:?Set WEB_ORIGIN},${POS_ORIGIN:?Set POS_ORIGIN}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?Set OTP_HMAC_SECRET}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
  DB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REPORT_TIMEZONE: Asia/Tehran
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?Set S3_PUBLIC_BASE_URL}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET:-kazhal-products}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  PAYMENT_GATEWAY_DRIVER: ${PAYMENT_GATEWAY_DRIVER:-zibal}
  ZIBAL_MERCHANT: ${ZIBAL_MERCHANT:-zibal}
  PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:8001/checkout/payment/return}
  PAYMENT_REVERIFY_ENABLED: ${PAYMENT_REVERIFY_ENABLED:-false}
  OTP_SMS_DRIVER: ${OTP_SMS_DRIVER:-log}
  KAVENEGAR_LOOKUP_URL: ${KAVENEGAR_LOOKUP_URL:-}
  KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE:-}
  FULFILMENT_RECOVERY_ENABLED: ${FULFILMENT_RECOVERY_ENABLED:-false}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

x-api-image: &api-image
  image: kazhal-api:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: apps/api/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${S3_BUCKET:-kazhal-products}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set download "local/$$MINIO_BUCKET"
    networks: [backend]

  migrate:
    <<: *api-image
    restart: "no"
    environment: *api-environment
    command:
      - node
      - node_modules/typeorm/cli.js
      - -d
      - dist/database/data-source.js
      - migration:run
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *api-image
    restart: unless-stopped
    init: true
    environment: *api-environment
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [backend, frontend]

  web:
    image: kazhal-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
        NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL:-${PUBLIC_API_URL}}
    restart: unless-stopped
    init: true
    environment:
      PORT: 8001
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:8000
      REALTIME_URL: http://api:8000
    expose:
      - "8001"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

  store:
    image: kazhal-store:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/store/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
        NEXT_PUBLIC_REALTIME_URL: ${PUBLIC_REALTIME_URL:-${PUBLIC_API_URL}}
    restart: unless-stopped
    init: true
    environment:
      PORT: 8002
      HOSTNAME: 0.0.0.0
      API_BASE_URL: http://api:8000
      REALTIME_URL: http://api:8000
    expose:
      - "8002"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres-data:
  redis-data:
  minio-data:
